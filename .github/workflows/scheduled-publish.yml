# Scheduled publishing: an episode or illustration with a future publish time is left out of the build
# (src/lib/dates.mjs), so the site has to be built again once that time comes. Every hour, if anything became due
# since the latest commit (the site is built on every push), push a small commit so Cloudflare builds it again.
# GitHub may start scheduled runs late, so posts can appear up to about an hour after their time.
name: Publish scheduled posts

on:
  schedule:
    - cron: '7 * * * *' # Off the hour, when GitHub's scheduled runs are least delayed.
  workflow_dispatch:

concurrency:
  group: content
  cancel-in-progress: false

# Actions are pinned to commit SHAs so a moved or hijacked tag can't swap their code (this job can push to the
# repository).
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the commit that makes Cloudflare build the site again.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for posts that became due
        id: due
        run: echo "due=$(node scripts/scheduled-due.mjs "$(git log -1 --format=%cI)")" >> "$GITHUB_OUTPUT"

      # A file change rather than an empty commit, so the build isn't skipped as having nothing to build.
      # Pushes made with the workflow's token don't start other workflow runs.
      - name: Rebuild the site
        if: steps.due.outputs.due == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-scheduled-publish
          git add .github/last-scheduled-publish
          git commit -m "Publish scheduled posts"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="予約した話・イラストを公開するための、サイトの作り直しに失敗しました。予約した時刻を過ぎても公開されていない可能性があります。

          - 実行ログ: ${RUN_URL}"
          gh label create deploy-failure --color B60205 --description "サイトへの反映の失敗" --force
          existing=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "サイトへの反映に失敗" --label deploy-failure --body "$body"
          fi
