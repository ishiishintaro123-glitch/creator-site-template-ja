title: サンプル短編〜雨宿り〜
synopsis: |-
  1話だけの作品の表示を確かめるためのサンプルです。自分の作品を載せたら、Pages CMSで削除してください。
  急な雨に降られて駆けこんだ古本屋で、一冊の本が棚から落ちてきた。
tags:
  - サンプル
episodes:
  - publishedAt: "2026-01-20T00:00"
    body: |-
      急な雨だった。
      駆けこんだ古本屋の軒先で、私は濡れた前髪を払った。

      店の奥から、ぱさり、と音がした。
      棚から一冊の文庫本が落ちている。拾い上げると、見返しに鉛筆の文字があった。

      「雨がやむまで、どうぞ」

      顔を上げると、店主らしき人が、奥のカウンターで小さくうなずいた。
      私はその本を開いて、雨の音を聞きながら、最初の一行を読みはじめた。
