title: サンプル小説〜灯台守の猫〜
synopsis: |-
  表示を確かめるためのサンプル作品です。自分の作品を載せたら、Pages CMSで削除してください。
  岬の灯台には、夜になると一匹の猫がやってくる。灯台守の少年は、猫が毎晩くわえてくる小さな貝殻の意味を知りたくなった。
tags:
  - サンプル
episodes:
  - title: 夜の訪問者
    publishedAt: "2026-01-01T00:00"
    body: |-
      岬の灯台に明かりが入ると、猫はきまって階段を上ってくる。
      灰色の毛並みに、片方だけ白い耳。名前はまだない。

      「また来たのか」

      少年が声をかけると、猫は返事の代わりに、くわえていた貝殻を床に置いた。
      桜色の、爪の先ほどの貝殻だった。

      窓の外では、灯台の光が海の上をゆっくりと回っている。
  - title: 貝殻の数
    publishedAt: "2026-01-08T00:00"
    body: |-
      貝殻は、毎晩ひとつずつ増えていった。
      少年はそれを空き瓶に入れて、窓辺に並べることにした。

      七つ目の夜、猫は貝殻を置かずに、じっと海を見ていた。
      その視線の先に、小さな船の明かりがひとつ、揺れていた。
  - title: 帰ってきた船
    publishedAt: "2026-01-15T00:00"
    body: |-
      翌朝、港に一隻の漁船が戻ってきた。
      嵐で帰れなくなっていた老いた漁師は、灯台の光をたよりに、七日かけて帰ってきたのだという。

      「あの猫は、うちのだよ」

      漁師は瓶の中の貝殻を見て、目を細めた。
      「港で待つあいだ、毎晩、浜に拾いに行っていたんだろう」

      その夜から、猫は漁師の家で眠るようになった。
      それでもときどき、灯台の階段を上ってくる。桜色の貝殻をひとつ、くわえて。

