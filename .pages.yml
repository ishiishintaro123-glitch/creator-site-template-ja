  - name: manga
    label: 漫画
    type: collection
    path: src/content/manga
    format: yaml
    subfolders: false
    filename:
      template: "{year}{month}{day}-{hour}{minute}{second}.yaml"
      field: create
    view:
      primary: title
      fields: [title]
    fields:
      - name: title
        label: 作品名
        type: string
        pattern:
          regex: '\S'
          message: 作品名を入力してください
      - name: synopsis
        label: あらすじ
        type: text
      - name: cover
        label: 表紙の画像
        description: この作品のリンクがXやLINEなどに貼られたときの画像にもなります。空欄なら第1話の1ページ目が表紙になります。
        type: image
        options:
          media: images
          path: manga
      - name: episodes
        label: 目次（話の一覧）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "第{index}話 {fields.title}"
        fields:
          - name: title
            label: 話のタイトル（任意）
            type: string
          - name: publishedAt
            label: 公開日時
            description: 公開日時になると自動で公開されます（反映まで10分ほどかかります）。先にCloudflareで予約投稿の設定が必要です（手順書「0_サイトの立ち上げ」の「予約投稿を使う」）。
            type: date
            options:
              time: true
          - name: pages
            label: この話のページ
            description: >-
              2ページ目以降も、この「Upload」で追加します。
              【今は画像を1枚ずつ選んでください】Pages CMSの不具合で、一度に複数選ぶと1枚しか残りません（修正待ち）。
              並び順は左のつまみで入れ替えられます。PNG・JPEG・WebP、1枚4.5MBまで。
            type: image
            options:
              media: images
              path: manga
              multiple: true
      - name: tags
        label: タグ
        type: string
        list: true
      - name: completed
        label: 完結
        description: チェックすると、作品一覧と目次に「完結」と表示されます。
        type: boolean

  - name: illustrations
    label: イラスト
    type: collection
    path: src/content/illustrations
    format: yaml
    subfolders: false
    filename:
      template: "{year}{month}{day}-{hour}{minute}{second}.yaml"
      field: create
    view:
      primary: images
      fields: [images, title, publishedAt]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: images
        label: 画像
        description: >-
          【今は画像を1枚ずつ選んでください】Pages CMSの不具合で、一度に複数選ぶと1枚しか残りません（修正待ち）。
          PNG・JPEG・WebP、1枚4.5MBまで。
        type: image
        options:
          media: images
          path: illustrations
          multiple: true
      - name: title
        label: タイトル（任意）
        type: string
      - name: description
        label: 説明（任意）
        type: text
      - name: publishedAt
        label: 公開日時
        description: 公開日時になると自動で公開されます（反映まで10分ほどかかります）。先にCloudflareで予約投稿の設定が必要です（手順書「0_サイトの立ち上げ」の「予約投稿を使う」）。
        type: date
        options:
          time: true
      - name: tags
        label: タグ
        type: string
        list: true

  - name: site
    label: サイト設定
    type: file
    path: site.config.yaml
    format: yaml
    fields:
      - name: author
        label: 作者名
        description: トップページ左上の作者ページへのリンク、作者ページの見出し、各ページの一番下に表示されます。
        type: string
        pattern:
          regex: '\S'
          message: 作者名を入力してください
      - name: profile
        label: 自己紹介（作者ページに表示）
        type: text
      - name: xNote
        label: Xのリンクの上に表示する文（任意）
        description: 例：「更新のお知らせはXで」
        type: text
      - name: xAccount
        label: XのユーザーID（@なし）
        description: 入れると、読者が作品をXでシェアしたときにあなたに通知が届きます。作者ページにもXへのリンクが付きます。使わなければ空欄のままで大丈夫です。
        type: string
        pattern:
          regex: ^@?[A-Za-z0-9_]{0,15}$
          message: 半角英数字とアンダースコア15文字以内で書いてください
      - name: links
        label: 作者ページにリンクを追加
        type: object
        list:
          collapsible:
            summary: "{fields.url}"
        fields:
          - name: note
            label: リンクの上に表示する文（任意）
            description: 例：「〇〇の購入は下のリンクから」
            type: text
          - name: url
            label: リンク先
            type: string
            pattern:
              regex: ^https://
              message: https:// から始まるアドレスで書いてください
      - name: siteName
        label: サイト名
        description: ブラウザのタブや検索結果、リンクがXやLINEなどに貼られたときに表示されます。
        type: string
        pattern:
          regex: '\S'
          message: サイト名を入力してください
      - name: description
        label: サイトの説明文
        description: 検索結果や、トップページのリンクがXやLINEなどに貼られたときに、サイトの紹介文として表示されます。
        type: text
        pattern:
          regex: '\S'
          message: サイトの説明文を入力してください
      - name: shareImage
        label: リンクが貼られたときの画像
        description: >-
          このサイトのページのリンクがXやLINEなどに貼られたときに、大きく表示される画像です（サイト共通の1枚）。
          横長の1200×630ピクセルがおすすめです（縦長の画像は、ぼかした背景の中央に全体が収まるよう自動で並べ直されます）。PNG・JPEG・WebP、4.5MBまで。
          表紙のある小説や、漫画・イラストのページでは、その作品の画像が優先されます。空欄なら画像なしの小さな表示になります。
        type: image
        options:
          media: images
          path: site
      - name: url
        label: サイトのURL
        description: このサイトのアドレスです。Xでシェアされるリンクや、検索エンジンに伝えるアドレスに使われます。独自ドメインがなければ、Cloudflareで発行された ○○.workers.dev のアドレスを入れてください。
        type: string
        pattern:
          regex: ^https?://
          message: https:// から始まるアドレスで書いてください
      - name: blockAi
        label: AIによる読み取りを断る
        description: >-
          オンにすると、ChatGPT・Claude・Geminiなどを運営する会社の読み取りプログラムに、このサイトを読まないよう求めます。AI向けの作品の案内（llms.txt）も作らなくなるため、ChatGPTなどのAIに、あなたのサイトの作品を紹介してもらいにくくなります。
          GoogleやBingなどの検索結果には、これまでどおり表示されます。読まないよう「求める」だけで、従うかどうかは各社しだいです。
        type: boolean
      - name: ads
        label: 広告
        type: object
        fields:
          - name: provider
            label: 広告サービス名
            description: プライバシーポリシーに表示されます。広告コードを貼るときは必ず入れてください。
            type: string
          - name: providerPrivacyUrl
            label: 広告サービスのプライバシーポリシーのURL（分かれば）
            type: string
            pattern:
              regex: ^(https://.*)?$
              message: https:// から始まるアドレスで書いてください
          - name: placements
            label: 広告の表示場所（コードを貼った欄に表示）
            type: object
            fields:
              - name: listFeed
                label: 作品一覧で、作品5つごとの間
                type: code
                options:
                  format: html
              - name: workToc
                label: 作品の目次の下
                type: code
                options:
                  format: html
              - name: afterEpisode
                label: 各話の一番下
                type: code
                options:
                  format: html
              - name: sidebar
                label: PCで見たときの本文の右側の余白
                type: code
                options:
                  format: html
              - name: sidebarLeft
                label: PCで見たときの本文の左側の余白
                type: code
                options:
                  format: html
          - name: adsTxt
            label: ads.txt の内容
            description: 広告サービスから ads.txt の設置を求められた場合だけ、その内容を貼ります。
            type: text
