# Pages CMS（https://app.pagescms.org）でブラウザから編集するための設定
# 各項目のルールは src/content.config.ts と src/site-config.mjs の検証内容に合わせています

# 「Configuration」メニューを隠す（画面から.pages.ymlを書き換えて編集画面を壊す誤操作を防ぐため。GitHubからは編集可能）
settings:
  config: false

# 原稿ファイルの取り込み用のアップロード先（作品の「原稿をまとめて取り込む」欄で使う）
media:
  - name: import
    label: 原稿の一時置き場
    input: src/content/import
    output: src/content/import
    extensions: [md, txt]
    rename: false
  # 漫画のページ・表紙とイラストの画像のアップロード先。同じ名前のファイルがぶつからないよう、名前は自動で付け直す
  - name: images
    label: 画像
    input: src/content/media
    output: src/content/media
    extensions: [png, jpg, jpeg, webp]
    rename: random

content:
  - name: works
    label: 小説
    type: collection
    path: src/content/novels
    format: yaml
    subfolders: false
    filename:
      template: "{year}{month}{day}-{hour}{minute}{second}.yaml"
      field: create
    view:
      primary: title
      fields: [title]
    fields:
      - name: title
        label: 作品名
        description: 1作品は全話を合わせて約30万字までです。超えそうになったら「小説の続き」で第2部を作ってください。
        type: string
        pattern:
          regex: '\S'
          message: 作品名を入力してください
      - name: synopsis
        label: あらすじ
        type: text
        pattern:
          regex: '\S'
          message: あらすじを入力してください
      - name: cover
        label: 表紙の画像（任意）
        description: >-
          作品一覧と目次に表示されます。この作品のリンクがXやLINEなどに貼られたときの画像にもなります。縦長（3:4）がおすすめです。
          空欄なら表紙なしで表示され、リンクが貼られたときはサイト設定の「リンクが貼られたときの画像」が使われます。
        type: image
        options:
          media: images
          path: novels
      - name: chapter
        label: 章の見出し（任意）
        description: 目次の第1話の上に表示されます。次の章は「小説の続き」で新しい部を作り、そこの「章の見出し」に入れます。章に分けないなら空欄のままで大丈夫です。
        type: string
      - name: episodes
        label: 目次
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "第{index}話 {fields.title}"
        fields:
          - name: title
            label: 話のタイトル（任意）
            type: string
          - name: publishedAt
            label: 公開日時
            description: 公開日時になると自動で公開されます（反映まで10分ほどかかります）。先にCloudflareで予約投稿の設定が必要です（手順書「0_サイトの立ち上げ」の「予約投稿を使う」）。
            type: date
            options:
              time: true
          - name: body
            label: 本文
            description: 改行はそのまま表示されます。空行を入れると段落の区切りになります。
            type: text
            pattern:
              regex: '\S'
              message: 本文を入力してください
      - name: import
        label: 原稿をまとめて取り込む
        description: >-
          .md・.txt のファイルが使えます。【今はファイルを1つずつ選んでください】Pages CMSの不具合で、一度に複数選ぶと1つしか残りません（修正待ち）。
          選んだファイルは、ファイル名の番号順（第1話、第2話…第10話）に目次の最後へ追加されます。
          原稿の1行目が「# タイトル」なら話のタイトルになります。公開日は取り込んだ日になります。あとから各話の公開日の欄で変えられます。
          保存してから1〜2分で目次に入り、そのあとは本文を直接直せます。取り込みが終わるまで、この作品は編集しないでください。
        type: file
        options:
          media: import
          multiple: true
          extensions: [md, txt]
      - name: tags
        label: タグ
        type: string
        list: true
      - name: completed
        label: 完結
        description: チェックすると、作品一覧と目次に「完結」と表示されます。
        type: boolean

